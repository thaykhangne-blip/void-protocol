name: JavaScript Syntax Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build modular game bundle
        run: npm run build

      - name: Check all JavaScript modules
        run: |
          set -eu
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print 2>/dev/null | sort | while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate package.json
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid JSON')"
